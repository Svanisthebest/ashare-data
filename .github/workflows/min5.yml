name: 分钟数据回补(5分钟)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "开始日期"
        default: "2022-01-01"
      nshards:
        description: "分片数（并行任务数）"
        default: "12"
      limit:
        description: "每片只拉前N只（0=全部，测试用）"
        default: "0"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: |
          N=${{ github.event.inputs.nshards }}
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"
      - name: 创建 Release（已存在则跳过）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view min5-data -R ${{ github.repository }} || gh release create min5-data -R ${{ github.repository }} -t "5分钟线数据" -n "min5_pull.py 生成，研究用"

  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            min5_pull.py
            data/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow baostock
      - name: 拉取
        run: python min5_pull.py --shard ${{ matrix.shard }} --nshards ${{ github.event.inputs.nshards }} --start ${{ github.event.inputs.start }} --limit ${{ github.event.inputs.limit }}
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload min5-data min5/*.parquet --clobber -R ${{ github.repository }}
