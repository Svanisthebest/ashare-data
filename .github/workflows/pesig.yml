name: 候选信号日估值 peTTM（研究用）

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: "分片数"
        default: "10"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.nshards }}))))")" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view pesig -R ${{ github.repository }} || gh release create pesig -R ${{ github.repository }} -t "候选信号日估值" -n "pe_pull.py 生成，研究用（第四十轮：基本面与炒作）"
  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pe_pull.py
            pe_sigdays.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas baostock
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python pe_pull.py --shard ${{ matrix.shard }} --nshards ${{ github.event.inputs.nshards }}
