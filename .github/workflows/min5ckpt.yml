name: 5分钟检查点（盘中弱转强研究）

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: "分片数"
        default: "16"
      limit:
        description: "每片只拉前N只（0=全部）"
        default: "0"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.nshards }}))))")" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view min5ckpt -R ${{ github.repository }} || gh release create min5ckpt -R ${{ github.repository }} -t "5分钟检查点" -n "min5_ckpt.py 生成，研究用"
  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            min5_ckpt.py
            min5_codes.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas baostock
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python min5_ckpt.py --shard ${{ matrix.shard }} --nshards ${{ github.event.inputs.nshards }} --limit ${{ github.event.inputs.limit }}
