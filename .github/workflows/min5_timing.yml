name: 分钟数据测速
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            min5_timing.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas baostock mootdx
      - run: timeout 1800 python min5_timing.py || true
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git sparse-checkout disable || true
          git add data/min5_timing.json || true
          git commit -m "min5 timing" || true
          git pull --rebase && git push
