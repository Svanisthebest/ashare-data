name: 指数1分钟历史分时
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index_minute.py
            data/daily
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas mootdx
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python index_minute.py --shard ${{ matrix.shard }} --nshards 6
