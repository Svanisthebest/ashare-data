name: 日线换手率（研究用）

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: "分片数"
        default: "16"
      limit:
        description: "每片只拉前N只（0=全部）"
        default: "0"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.nshards }}))))")" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view turnover -R ${{ github.repository }} || gh release create turnover -R ${{ github.repository }} -t "日线换手率" -n "turn_pull.py 生成，研究用"
  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            turn_pull.py
            turn_codes.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas baostock
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python turn_pull.py --shard ${{ matrix.shard }} --nshards ${{ github.event.inputs.nshards }} --limit ${{ github.event.inputs.limit }}
