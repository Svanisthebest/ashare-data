name: 候选股逐笔回补

on:
  workflow_dispatch:
    inputs:
      nshards:
        description: "分片数"
        default: "10"
      limit:
        description: "每片只做前N个（0=全部）"
        default: "0"
      targets:
        description: "目标清单文件"
        default: "tick_targets.csv"
      prefix:
        description: "输出文件名前缀"
        default: ""
      fullday:
        description: "保留全天分钟线(1=是)"
        default: "0"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        run: echo "shards=$(python3 -c "import json;print(json.dumps(list(range(${{ github.event.inputs.nshards }}))))")" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view tick-data -R ${{ github.repository }} || gh release create tick-data -R ${{ github.repository }} -t "候选股逐笔合成数据" -n "tick_pull.py 生成"
  pull:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tick_pull.py
            tick_targets.csv
            tick_targets_zt.csv
            tick_targets_exit.csv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow mootdx
      - run: python tick_pull.py --shard ${{ matrix.shard }} --nshards ${{ github.event.inputs.nshards }} --limit ${{ github.event.inputs.limit }} --targets ${{ github.event.inputs.targets }} --prefix "${{ github.event.inputs.prefix }}" $( [ "${{ github.event.inputs.fullday }}" = "1" ] && echo --fullday )
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload tick-data ticks/*.csv.gz --clobber -R ${{ github.repository }}
