name: 题材板块数据
on:
  workflow_dispatch:
    inputs:
      limit:
        default: ""
  schedule:
    - cron: "50 11 * * 1-5"   # 北京时间 19:50
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            theme_pull.py
            data/theme
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: 准备 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view theme-data -R ${{ github.repository }} || gh release create theme-data -R ${{ github.repository }} -t "题材板块数据进度" -n "theme_pull.py 心跳"
      - name: 拉取（每20个板块上传一次心跳）
        env:
          GH_TOKEN: ${{ github.token }}
        run: LIMIT="${{ github.event.inputs.limit }}" python theme_pull.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theme || true
          git commit -m "theme data" || echo "无变化"
          git pull --rebase && git push
