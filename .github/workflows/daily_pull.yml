name: A股每日数据

on:
  schedule:
    - cron: "0 11 * * 1-5"    # 北京时间 19:00（通达信盘后包通常收盘后数小时发布）
    - cron: "30 13 * * 1-5"   # 北京时间 21:30，补跑一次
  workflow_dispatch:
    inputs:
      date:
        description: "交易日 YYYYMMDD，留空为北京时间今天"
        required: false
        default: ""
      backfill:
        description: "补齐最近N个交易日（不用时填 0）"
        required: false
        default: "0"
      backfill_start:
        description: "回补起始日 YYYYMMDD，例如 20220101（留空则不用）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 确定日期
        id: d
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Asia/Shanghai date +%Y%m%d); fi
          B="${{ github.event.inputs.backfill }}"
          if [ -z "$B" ]; then B=0; fi
          S="${{ github.event.inputs.backfill_start }}"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "backfill=$B" >> "$GITHUB_OUTPUT"
          echo "start=$S" >> "$GITHUB_OUTPUT"

      - name: 拉取数据
        run: |
          if [ -n "${{ steps.d.outputs.start }}" ]; then
            python daily_pull.py --date ${{ steps.d.outputs.date }} --backfill-start ${{ steps.d.outputs.start }} --out data
          else
            python daily_pull.py --date ${{ steps.d.outputs.date }} --backfill ${{ steps.d.outputs.backfill }} --out data
          fi

      - name: 生成 v1 次日计划
        if: success()
        run: |
          D=$(ls data/daily | tail -1 | cut -c1-8)
          python clusters_daily.py --date $D --out data && python v1_plan.py --date $D --out data || echo "计划生成失败"

      - name: 提交到仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data ${{ steps.d.outputs.date }}" || echo "没有新数据"
          git pull --rebase
          git push
